
services:
  db:
    image: postgres:${POSTGRES_VERSION}
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_fiesta_db_datas:/var/lib/postgresql/data

  odoo:
    user: root
    image: odoo:${ODOO_VERSION}
    container_name: ${ODOO_CONTAINER_NAME}
    restart: always
    depends_on:
      - db
    ports:
      - ${ODOO_PORT}:8069
    volumes:
      - odoo_fiesta_web_datas:/var/lib/odoo
      - ${CONFIG_PATH}:/etc/odoo/
      - ${ADDONS_PATH}:/mnt/extra-addons
      - ${ENTREPRISE_PATH}:/mnt/entreprise-addons
      - ./requirements.txt:/mnt/requirements.txt:ro
    # command: sh -c "pip config set global.break-system-packages true && pip install -r /mnt/requirements.txt && odoo -c /etc/odoo/odoo.conf -i base"
    command: odoo -c /etc/odoo/odoo.conf --dev xml,qweb
    # command: ["--", "-d", "odoo_v19_fiesta", "-i", "base"]

volumes:
  odoo_fiesta_web_datas:
  postgres_fiesta_db_datas:
